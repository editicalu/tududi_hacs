create_task:
  fields:
    name:
      required: true
      example: Buy milk
      selector:
        text: {}
    note:
      selector:
        text:
          multiline: true
    due_date:
      selector:
        date: {}
    defer_until:
      selector:
        datetime: {}
    priority:
      selector:
        select:
          options:
          - low
          - medium
          - high
          mode: dropdown
          multiple: false
    status:
      selector:
        select:
          options:
          - not_started
          - in_progress
          - done
          - archived
          - waiting
          - cancelled
          - planned
          mode: dropdown
          multiple: false
    project:
      example: Home
      selector:
        text: {}
    area:
      selector:
        text: {}
    goal:
      selector:
        text: {}
    parent_task:
      selector:
        text: {}
    tags:
      selector:
        text:
          multiple: true
    estimated_minutes:
      selector:
        number:
          min: 5
          max: 720
          mode: box
          unit_of_measurement: min
    recurrence_type:
      selector:
        select:
          options:
          - none
          - daily
          - weekly
          - monthly
          - monthly_weekday
          - monthly_last_day
          - yearly
          mode: dropdown
          multiple: false
    recurrence_interval:
      selector:
        number:
          min: 1
          max: 365
          mode: box
    recurrence_end_date:
      selector:
        date: {}
    recurrence_weekday:
      selector:
        number:
          min: 0
          max: 6
          mode: box
    recurrence_weekdays:
      selector:
        select:
          options:
          - '0'
          - '1'
          - '2'
          - '3'
          - '4'
          - '5'
          - '6'
          mode: dropdown
          multiple: true
    recurrence_month_day:
      selector:
        number:
          min: 1
          max: 31
          mode: box
    recurrence_week_of_month:
      selector:
        number:
          min: 1
          max: 5
          mode: box
    completion_based:
      selector:
        boolean: {}
    assigned_to:
      selector:
        text: {}
    subtasks:
      selector:
        text:
          multiple: true
    config_entry_id:
      selector:
        config_entry:
          integration: tududi
    extra:
      selector:
        object: {}

